spring.application.name=CampusBaazar
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:h2:file:./data/campusbaazar;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

app.bootstrap.admin-email=${APP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${APP_ADMIN_NAME:CampusBaazar Admin}
app.bootstrap.admin-institution=${APP_ADMIN_INSTITUTION:CampusBaazar Operations}

# Optional seller description assistant. The application runs normally when disabled.
app.ai.enabled=${APP_AI_ENABLED:false}
app.ai.gemini-api-key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
app.ai.model=${GEMINI_MODEL:gemini-2.5-flash}
